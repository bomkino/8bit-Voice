# Tests the engine, builds the desktop apps on each system, and on main
# publishes them as a GitHub Release when desktop/package.json has a version
# that hasn't been released yet.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Command line makes a clip
        run: |
          node cli.mjs "(offended) I never said I'd call." --voice heist-producer --phone --out clip.wav
          test "$(head -c 4 clip.wav)" = RIFF

  desktop:
    name: ${{ matrix.name }}
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            script: dist:mac
          - name: Windows
            os: windows-latest
            script: dist:win
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # No certificates: the Mac app is signed ad hoc ("-"), Windows unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check the Mac apps' signatures
        if: runner.os == 'macOS'
        run: |
          for app in "dist/mac-arm64/8-bit Voice.app" "dist/mac/8-bit Voice.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            lipo -archs "$app/Contents/MacOS/8-bit Voice"
          done
          hdiutil verify dist/8-bit-Voice-mac-arm64.dmg
          hdiutil verify dist/8-bit-Voice-mac-x64.dmg
      - name: Open the Mac app
        if: runner.os == 'macOS'
        run: |
          "dist/mac-arm64/8-bit Voice.app/Contents/MacOS/8-bit Voice" &
          sleep 15
          kill -0 $! || { echo "The app quit within 15 s"; exit 1; }
          echo "still running after 15 s"
          kill $!

      - name: Open the Linux app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a dist/linux-unpacked/8bit-voice &
          sleep 15
          pgrep -f 8bit-voice.bin > /dev/null || { echo "The app quit within 15 s"; exit 1; }
          echo "still running after 15 s"
          pkill -f 8bit-voice.bin || true
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/8-bit-Voice-linux-amd64.deb | grep -E 'Package|Architecture|Version'
          dpkg-deb --info dist/8-bit-Voice-linux-arm64.deb | grep -E 'Package|Architecture|Version'

      - name: Open the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\win-unpacked\8-bit Voice.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "The app quit within 15 s (exit $($p.ExitCode))" }
          "still running after 15 s"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: 8-bit-Voice-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/8-bit-Voice-*.dmg
            desktop/dist/8-bit-Voice-*.zip
            desktop/dist/8-bit-Voice-*.exe
            desktop/dist/8-bit-Voice-*.AppImage
            desktop/dist/8-bit-Voice-*.deb

  release:
    name: Release
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Is this version released yet?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "v$v is already out; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd out
          sha256sum 8-bit-Voice-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sed "s/{{version}}/${TAG#v}/g" ../.github/release-notes.md > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "8-bit Voice ${TAG#v}" --notes-file notes.md --latest 8-bit-Voice-* SHA256SUMS.txt
