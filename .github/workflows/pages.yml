# Puts the web app on GitHub Pages: https://bomkino.github.io/8bit-Voice/
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Gather the site
        run: |
          mkdir -p _site
          cp index.html chipvoice.js sw.js manifest.webmanifest LICENSE _site/
          cp -r fonts icons _site/
          touch _site/.nojekyll
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
